spring.application.name=bibliotecas-backend
server.port=8080

# --- Base de datos H2 en memoria ---
# Los datos se reinician en cada arranque y DataInitializer vuelve a cargar los datos de prueba.
spring.datasource.url=jdbc:h2:mem:bibliotecas_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Consola web de H2 (solo desarrollo): http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- CORS: origen del frontend ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
